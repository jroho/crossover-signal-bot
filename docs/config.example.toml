[app]
symbols = ["QQQ", "SPY"]
market_timezone = "America/New_York"

[indicators]
ema_length = 9
sma_fast_length = 15
sma_slow_length = 30
rvgi_length = 10
rvgi_signal_length = 10

[volume]
prior_window = 5
use_rolling_average = true
rolling_window = 10
strong_ratio = 1.2
acceptable_ratio = 0.9
top_n_strong = 2

[confirmation]
enable_one_min_confirmation = true
require_one_min_confirmation = false

[grading]
# The lowest grade listed is the alert floor, so ["A", "B"] also alerts A+.
alert_grades = ["A", "B"]
allow_grade_c_soft_alerts = false
allow_grade_b_itm = true
# OTM bias is only ever recommended for A+ setups.
allow_grade_a_otm = true
allow_two_otm = false
# A 5m SMA 15/30 cross older than this many 5m bars is "stale" and no longer triggers.
fresh_cross_max_bars = 3
# A+ requires the cross to be at most this many 5m bars old.
a_plus_max_cross_bars = 1

[outcomes]
# Underlying move (percent) that counts as a realized pop win or loss, and the win-strength buckets.
pop_threshold_pct = 0.17
pop_grade_b_pct = 0.34
pop_grade_a_pct = 0.51

[storage]
sqlite_path = "logs/signals.sqlite3"
evaluation_csv_path = "logs/evaluations.csv"
alert_csv_path = "logs/alerts.csv"

[replay]
csv_path = "tests/fixtures/sample_intraday.csv"
send_telegram = false
export_csv_path = ""

[telegram]
enabled = false
bot_token = ""
chat_id = ""

[data]
# "alpaca" or "polygon". Leave empty to use whichever provider has credentials below.
provider = "alpaca"

[alpaca]
enabled = true
# Or set APCA_API_KEY_ID / APCA_API_SECRET_KEY in the environment.
api_key_id = ""
api_secret_key = ""
paper = true
# Backfills use the consolidated tape; the free plan withholds its latest 15 minutes.
historical_feed = "sip"
# The live window is served by the real-time IEX feed on the free plan.
live_feed = "iex"
adjustment = "split"

[polygon]
enabled = false
base_url = "https://api.polygon.io"
api_key = ""

[trading]
enabled = false
paper = true
# Sizing uses this, not the broker's equity, so a $100K paper account behaves like $500.
risk_capital_usd = 500
usd_per_contract = 1250
bear_multiplier = 2
max_contracts = 3
max_position_cost_pct = 50
max_open_positions = 2
# Each crossover episode is decided once, on its first evaluation graded at least this; below min_grade it is skipped
# rather than re-checked for an upgrade (A+ that arrived after a lower first grade won 38% in the backtest).
entry_floor_grade = "B"
min_grade = "A"
plain_a_max_lag_min = 5
require_alignment = true
# true: an A+ setup also passes the alignment filter when it is the symbol's first regular-hours cross of the day
# or the other watched symbol crossed the same way within confirmation_window_min minutes (plain A still needs the
# day's bias). Backtest: ~80 trades/yr at 69% instead of 55 at 67%.
a_plus_confirmation = false
confirmation_window_min = 10
# Crosses in the same direction within this many minutes are one episode (the interpolated cross time drifts
# between polls while the 5m bar is still printing; without merging the same cross gets re-decided).
episode_merge_minutes = 5
# The bear multiplier applies only to aligned bears at or above this grade; "A+" aligned bears won 88% in both
# halves of the backtest year, plain-A bears did not.
press_min_grade = "A"
# bull / bear / neutral, set before the open from the headlines; empty uses the data bias.
daily_bias_override = ""
# Entry window. The first 15 minutes and noon-to-one bull entries lost in both backtests: "09:45" and "12:00".
first_entry_time = ""
last_entry_time = "13:00"
bull_last_entry_time = ""
flat_time = "15:35"
max_hold_minutes = 45
target_pct = 30
stop_pct = 30
entry_limit_buffer = 0.02
entry_timeout_minutes = 3
daily_loss_limit_usd = 150
max_losses_per_day = 2
drawdown_kill_usd = 200
# "indicative" is free; "opra" needs the paid options data plan.
option_feed = "indicative"
journal_sqlite_path = "logs/live_trades.sqlite3"
journal_csv_path = "logs/live_trades.csv"

[live]
lookback_minutes = 180
poll_seconds = 60
market_open_time = "09:30"
market_close_time = "15:45"



[schedule]
# Windows scheduled tasks: edit here, then run scripts/schedule_install.ps1 to apply.
# Times are Eastern (market time); the installer converts them to this machine's local time.
enabled = true
mode = "paper"              # paper or dry-run
bias = ""                   # testing override only (bull/bear/neutral); empty = data bias
start_time = "09:20"        # start the loop; it waits for the 09:45 entry window
stop_time = "15:40"         # after the 15:35 flatten: stop the loop and run the parity check
days = "MON,TUE,WED,THU,FRI"
